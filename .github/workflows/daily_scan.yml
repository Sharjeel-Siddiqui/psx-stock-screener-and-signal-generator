name: PSX Daily Signal Scan

on:
  workflow_dispatch:

  schedule:
    # 16:30 Pakistan Standard Time
    # 11:30 UTC
    - cron: "30 11 * * 1-5"


# Prevent two scans from running at the same time.
# This is important because state.json is updated by the workflow.
concurrency:
  group: psx-daily-scan
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ================================================
      # DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ================================================
      # RUN SCANNER
      # ================================================

      - name: Run PSX scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          python scanner.py


      # ================================================
      # SAVE STATE
      # ================================================

      - name: Commit updated signal state
        run: |

          git config user.name "psx-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update alert state"
            
            # Fetch latest remote changes
            git fetch origin main
            
            # Rebase local changes on top of remote
            git rebase origin/main
            
            # Push with force-with-lease (safe force push after rebase)
            git push --force-with-lease origin HEAD:main
          fi
