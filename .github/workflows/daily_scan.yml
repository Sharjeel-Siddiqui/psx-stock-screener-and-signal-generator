name: PSX Daily Signal Scan

on:
  workflow_dispatch:

  schedule:
    # 16:30 Pakistan Standard Time
    # 11:30 UTC
    - cron: "30 11 * * 1-5"


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ================================================
      # DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ================================================
      # RUN SCANNER
      # ================================================

      - name: Run PSX scanner
        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          python scanner.py


      # ================================================
      # SAVE STATE
      # ================================================

      - name: Commit updated signal state
        run: |

          git config user.name "psx-alert-bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || \
            git commit -m "Update alert state"

          git push