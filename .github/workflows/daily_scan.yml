name: PSX Daily Signal Scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: main (scan for signals) or reminder (re-send last alerts)"
        required: false
        default: "main"
        type: choice
        options:
          - main
          - reminder

  schedule:
    # MAIN scan — 16:30 Pakistan Standard Time (11:30 UTC)
    - cron: "30 11 * * 1-5"
    # REMINDER — next-morning, pre-market
    # 09:00 Pakistan Standard Time (04:00 UTC)
    - cron: "0 4 * * 1-5"


concurrency:
  group: psx-daily-scan
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      # ================================================
      # SYNC WITH LATEST MAIN
      # ================================================

      - name: Sync with main
        run: |
          git config user.name "psx-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ================================================
      # DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ================================================
      # RUN PSX SCANNER
      # ================================================

      - name: Run PSX scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}

        run: |
          # Decide run mode:
          #  - manual dispatch: honour the chosen input
          #  - the 23:30 UTC cron: reminder run
          #  - anything else (11:30 UTC cron): main scan
          MODE="${DISPATCH_MODE}"

          if [ -z "$MODE" ]; then
            if [ "$SCHEDULE" = "0 4 * * 1-5" ]; then
              MODE="reminder"
            else
              MODE="main"
            fi
          fi

          echo "Resolved run mode: $MODE"
          RUN_MODE="$MODE" python scanner.py


      # ================================================
      # SAVE STATE
      # ================================================

      - name: Commit updated signal state
        run: |

          git config user.name "psx-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json portfolio.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update alert state and paper portfolio"

          # Sync with the latest remote main.
          git fetch origin main

          # Rebase our state update on top of latest main.
          git rebase origin/main

          # Push safely.
          git push --force-with-lease origin HEAD:main
