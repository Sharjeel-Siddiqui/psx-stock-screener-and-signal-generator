name: PSX Daily Signal Scan

on:
  workflow_dispatch:

  schedule:
    # 16:30 Pakistan Standard Time
    # 11:30 UTC
    - cron: "30 11 * * 1-5"


concurrency:
  group: psx-daily-scan
  cancel-in-progress: false


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      # ================================================
      # SYNC WITH LATEST MAIN
      # ================================================

      - name: Sync with main
        run: |
          git config user.name "psx-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ================================================
      # DEPENDENCIES
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ================================================
      # RUN PSX SCANNER
      # ================================================

      - name: Run PSX scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          python scanner.py


      # ================================================
      # SAVE STATE
      # ================================================

      - name: Commit updated signal state
        run: |

          git config user.name "psx-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update alert state"

          # Sync with the latest remote main.
          git fetch origin main

          # Rebase our state update on top of latest main.
          git rebase origin/main

          # Push safely.
          git push --force-with-lease origin HEAD:main
